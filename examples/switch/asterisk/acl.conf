; Referenced by "acl=freesbc-only" on the carrier endpoints in pjsip.conf.
; The carrier endpoint may skip authentication, so only FreeSBC's private.ip
; may be identified as it. Also firewall UDP 5080 to private.ip (see README.md).
; One permit per FreeSBC node. Node B is the second line; delete it for a single node.
[freesbc-only]
deny=0.0.0.0/0.0.0.0
permit=10.77.0.2/255.255.255.255
permit=10.77.0.3/255.255.255.255
