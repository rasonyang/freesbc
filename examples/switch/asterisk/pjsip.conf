; FreeSBC reference topology: switch 10.77.0.10 behind two FreeSBC nodes, private.ip
; 10.77.0.2 (node A) and 10.77.0.3 (node B). For a single node, delete everything marked
; "node B".
; Asterisk 22 (pjsip). See README.md for the docs/edge.md rule each block satisfies.
;
; Placeholders to replace: passwords (CHANGE-ME-*), the carrier host names and
; the carrier account.

; ---------------------------------------------------------------------------
; Global
; ---------------------------------------------------------------------------
[global]
type=global
; Identify by the X-FreeSBC-Carrier header, then by From user (digest follows).
; "ip" and "anonymous" are left out ON PURPOSE: client calls also arrive from
; private.ip, so any IP-based match, or an anonymous endpoint, would skip digest
; authentication for every client call.
; "header" comes first so a carrier call whose From user happens to equal a
; client name is not mistaken for that client and challenged.
; (To identify by registration line instead, see the commented line=yes below
; and add request_uri after header.)
endpoint_identifier_order=header,username,auth_username

; ---------------------------------------------------------------------------
; Transports: UDP only, one socket per port. FreeSBC reaches the switch on
; edge.switch (5060) for clients and edge.switch_carrier_port (5080) for carriers.
; No external_*_address / local_net: there is no NAT between the switch and FreeSBC.
; ---------------------------------------------------------------------------
[transport-clients]
type=transport
protocol=udp
bind=10.77.0.10:5060

[transport-carrier]
type=transport
protocol=udp
bind=10.77.0.10:5080

; ---------------------------------------------------------------------------
; Clients (phones, softphones, browsers). Always digest-authenticated.
; ---------------------------------------------------------------------------
[client-endpoint](!)
type=endpoint
transport=transport-clients
context=from-clients
disallow=all
allow=ulaw,alaw,opus
dtmf_mode=rfc4733
; FreeSBC anchors all media and rewrites Contact and SDP to private.ip:
; keep the switch out of NAT handling.
direct_media=no
rewrite_contact=no
force_rport=no
rtp_symmetric=no
ice_support=no
media_encryption=no
; Plain RTP/AVP, also for WebRTC clients (FreeSBC terminates DTLS-SRTP/ICE).
; Do not set webrtc=yes.
webrtc=no
; 100rel / PRACK / UPDATE, SUBSCRIBE (MWI, BLF), REFER and MESSAGE are proxied.
; The switch authenticates and routes them by its own policy.
allow_subscribe=yes
send_pai=no
; Tear a call down when no RTP arrives for 30 s, so a channel whose FreeSBC node died
; does not stay up (the dead node's media anchor is gone and nobody sends BYE).
rtp_timeout=30
; Pin the switch's own address for SDP when the host has several interfaces.
media_address=10.77.0.10

[client-auth](!)
type=auth
auth_type=userpass

[client-aor](!)
type=aor
; One Contact per user: a client that re-registers through the other FreeSBC node
; replaces its old (now stale) Contact instead of adding a second one.
max_contacts=1
remove_existing=yes
; The registrar must put an expiry in the 200 OK; Asterisk does, bounded here.
default_expiration=300
minimum_expiration=60
maximum_expiration=3600
; No qualify by default: a client's reachability is its registration. Setting
; qualify_frequency (seconds) pings through FreeSBC like any client request (see README.md).
qualify_frequency=0

; One block per user. The endpoint name is the username, so the "username"
; identifier finds it and then challenges.
[1001](client-endpoint)
auth=1001
aors=1001
[1001](client-auth)
username=1001
password=CHANGE-ME-1001
[1001](client-aor)

[1002](client-endpoint)
auth=1002
aors=1002
[1002](client-auth)
username=1002
password=CHANGE-ME-1002
[1002](client-aor)

; ---------------------------------------------------------------------------
; Carriers. One endpoint, aor (and registration) per FreeSBC node: "carrier-a" goes
; out through node A, "carrier-a-b" through node B (the same for "mobile" and
; "mobile-b"). extensions.conf dials node A first and node B on 503 or no answer.
; ---------------------------------------------------------------------------
[carrier-endpoint](!)
type=endpoint
transport=transport-carrier
context=from-carrier
disallow=all
allow=ulaw,alaw
dtmf_mode=rfc4733
direct_media=no
rewrite_contact=no
force_rport=no
rtp_symmetric=no
ice_support=no
media_encryption=no
rtp_timeout=30
; Only FreeSBC (any node, see acl.conf) may be identified as this endpoint.
acl=freesbc-only

[carrier-aor](!)
type=aor
; Health check of the path through the node: an OPTIONS to the carrier host is
; answered by the carrier, or by FreeSBC itself with 503 while the node drains.
qualify_frequency=30
qualify_timeout=3

; ---------------------------------------------------------------------------
; Carrier "carrier-a": registered account, host name without a port.
; The aor contact must equal the edge.carriers entry (sip.carrier-a.com).
; ---------------------------------------------------------------------------
[carrier-a](carrier-endpoint)
aors=carrier-a
outbound_auth=carrier-a
; The switch speaks to FreeSBC; ";lr" is required. Backslash keeps the
; semicolon from starting a comment.
outbound_proxy=sip:10.77.0.2:5060\;lr

[carrier-a](carrier-aor)
contact=sip:sip.carrier-a.com
outbound_proxy=sip:10.77.0.2:5060\;lr

[carrier-a]
type=auth
auth_type=userpass
username=acct
password=CHANGE-ME-CARRIER-A

[carrier-a]
type=registration
transport=transport-carrier
outbound_auth=carrier-a
server_uri=sip:sip.carrier-a.com
client_uri=sip:acct@sip.carrier-a.com
contact_user=acct
outbound_proxy=sip:10.77.0.2:5060\;lr
expiration=3600
retry_interval=60
forbidden_retry_interval=600
; Alternative to the identify below: have the carrier's calls identified by
; the registration line. FreeSBC restores the original Contact, ";line=..."
; included, in the Request-URI. Needs request_uri in endpoint_identifier_order.
; The line token is the only secret, so prefer the header match.
;line=yes
;endpoint=carrier-a

; Inbound identification by the header FreeSBC stamps on every carrier request.
; FreeSBC strips X-FreeSBC-* from public input, so a client cannot send it.
; One identify serves both nodes: the header names the carrier, not the node.
[carrier-a]
type=identify
endpoint=carrier-a
match_header=X-FreeSBC-Carrier: /^carrier-a$/

; --- node B: the same carrier through the second FreeSBC node --------------
; A registered trunk registers once per node. Use a separate carrier account for
; node B (acct-b): a carrier that keeps one Contact per account would otherwise
; let the second registration replace the first. Its calls arrive with the
; Request-URI user acct-b (see [did] in extensions.conf).
[carrier-a-b](carrier-endpoint)
aors=carrier-a-b
outbound_auth=carrier-a-b
outbound_proxy=sip:10.77.0.3:5060\;lr

[carrier-a-b](carrier-aor)
contact=sip:sip.carrier-a.com
outbound_proxy=sip:10.77.0.3:5060\;lr

[carrier-a-b]
type=auth
auth_type=userpass
username=acct-b
password=CHANGE-ME-CARRIER-A-B

[carrier-a-b]
type=registration
transport=transport-carrier
outbound_auth=carrier-a-b
server_uri=sip:sip.carrier-a.com
client_uri=sip:acct-b@sip.carrier-a.com
contact_user=acct-b
outbound_proxy=sip:10.77.0.3:5060\;lr
expiration=3600
retry_interval=60
forbidden_retry_interval=600

; ---------------------------------------------------------------------------
; Carrier "mobile": no registration, explicit port, identified by header only
; (the carrier sends to a DID). edge.carriers entry: 223.76.90.4:16060
; The carrier must be given both FreeSBC public addresses.
; ---------------------------------------------------------------------------
[mobile](carrier-endpoint)
aors=mobile
outbound_proxy=sip:10.77.0.2:5060\;lr

[mobile](carrier-aor)
contact=sip:223.76.90.4:16060
outbound_proxy=sip:10.77.0.2:5060\;lr

[mobile]
type=identify
endpoint=mobile
match_header=X-FreeSBC-Carrier: /^mobile$/

; --- node B ----------------------------------------------------------------
[mobile-b](carrier-endpoint)
aors=mobile-b
outbound_proxy=sip:10.77.0.3:5060\;lr

[mobile-b](carrier-aor)
contact=sip:223.76.90.4:16060
outbound_proxy=sip:10.77.0.3:5060\;lr
