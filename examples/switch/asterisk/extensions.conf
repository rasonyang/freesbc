; Dialplan for the FreeSBC reference topology. See README.md.

[general]
static=yes
writeprotect=no

; --- Authenticated clients (arrive on 5060 from private.ip) ----------------
[from-clients]
; Every call an authenticated user originates is counted against the per-user
; concurrent-call limit first ([user-limit]), so a user-to-user call, a call to
; a carrier and a feature code all count, and no route can skip it.

; Echo test.
exten => 600,1,Gosub(user-limit,s,1)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Internal extensions: ring the registered contact.
exten => _10XX,1,Gosub(user-limit,s,1)
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; National numbers only (10 digits, leading 0, no international or premium
; prefixes). Anything else falls through to the reject below.
exten => _0[1-9]XXXXXXXX,1,Gosub(user-limit,s,1)
 same => n,Gosub(outbound,s,1(${EXTEN}))
 same => n,Hangup()

; International and everything unmatched: refuse and log (toll-fraud guard).
exten => _X.,1,Gosub(user-limit,s,1)
 same => n,NoOp(REJECTED ${CALLERID(num)} -> ${EXTEN})
 same => n,Hangup(21)

; --- Per-user concurrent-call limit ----------------------------------------
; The key is the identity Asterisk authenticated: ${CHANNEL(endpoint)} is the
; pjsip endpoint name, which this config makes the username (pjsip.conf). Do
; not key on CALLERID(num): the From user is the caller's choice, so a caller
; who changes it on every call would never reach the limit. At most 3
; concurrent calls per user, ringing included: a consult transfer needs 2, and
; the third covers a lost BYE or an immediate redial while the switch still
; holds the old channel. A call over the limit gets Busy() before any Dial, so
; no leg and no edge media port is taken. A carrier's call to a user
; ([from-carrier]) is not the user's own call and stays out of the count.
[user-limit]
exten => s,1,Set(GROUP(user)=${CHANNEL(endpoint)})
 same => n,GotoIf($[${GROUP_COUNT(${CHANNEL(endpoint)}@user)} > 3]?over)
 same => n,Return()
 same => n(over),Busy()
 same => n,Hangup()

; --- Sequential carrier failover with limits -------------------------------
; Each carrier is tried through FreeSBC node A, then through node B, then the next
; carrier. "CHANUNAVAIL" (node known down, a 404, ...) and "CONGESTION" (a 503, which is
; also what a draining node answers) mean the call was not placed, so the next target is
; safe to try. A node that does not answer at all ends with the same two statuses after the
; INVITE timer (32 s); qualify on the carrier aor (pjsip.conf) skips a node already
; found down. NOANSWER, BUSY and CANCEL are not retried: the far end may have rung.
[outbound]
; ARG1 = dialed number (EXTEN is "s" inside a subroutine)
 ; maximum call duration (seconds) for the whole call
exten => s,1,Set(TIMEOUT(absolute)=3600)
 ; per-carrier concurrency: carrier-a at most 30 channels
 same => n,Set(GROUP(carrier)=carrier-a)
 same => n,GotoIf($[${GROUP_COUNT(carrier-a@carrier)} > 30]?trynext)
 same => n,Gosub(via-nodes,s,1(${ARG1},carrier-a))
 ; failover only when carrier-a could not take the call
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?trynext)
 same => n,Hangup()
 same => n(trynext),Set(GROUP(carrier)=mobile)
 same => n,Gosub(via-nodes,s,1(${ARG1},mobile))
 same => n,Hangup()

; ARG1 = number, ARG2 = carrier endpoint through node A (node B is "<ARG2>-b").
; For a single node, keep only the first Dial and the Return.
[via-nodes]
exten => s,1,Dial(PJSIP/${ARG1}@${ARG2},60,L(3600000:60000:30000))
 same => n,NoOp(${ARG2} DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE})
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?nodeb)
 same => n,Return()
 ; node B
 same => n(nodeb),Dial(PJSIP/${ARG1}@${ARG2}-b,60,L(3600000:60000:30000))
 same => n,NoOp(${ARG2}-b DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE})
 same => n,Return()

; --- Carriers (arrive on 5080, identified as the carrier endpoint) ----------
; This context can only ring local extensions: no Dial to a carrier, no
; transfer out, so a compromised carrier account cannot pivot to toll fraud.
[from-carrier]
exten => _[0-9A-Za-z].,1,NoOp(carrier=${CHANNEL(endpoint)} X-FreeSBC-Carrier=${PJSIP_HEADER(read,X-FreeSBC-Carrier)} DID=${EXTEN} from=${CALLERID(num)})
 same => n,Goto(did,${EXTEN},1)

[did]
; Registered line (Request-URI user is the contact_user) and explicit DIDs.
exten => acct,1,Dial(PJSIP/1001,30)
 same => n,Hangup()
; The account registered through node B (carrier-a-b) has its own user.
exten => acct-b,1,Dial(PJSIP/1001,30)
 same => n,Hangup()
exten => 5551001,1,Dial(PJSIP/1001,30)
 same => n,Hangup()
exten => _[0-9A-Za-z].,1,Hangup(1)
