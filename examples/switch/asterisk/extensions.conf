; Dialplan for the FreeSBC reference topology. See README.md.

[general]
static=yes
writeprotect=no

; --- Authenticated clients (arrive on 5060 from private.ip) ----------------
[from-clients]
; Echo test.
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Internal extensions: ring the registered contact.
exten => _10XX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; National numbers only (10 digits, leading 0, no international or premium
; prefixes). Anything else falls through to the reject below.
exten => _0[1-9]XXXXXXXX,1,Gosub(outbound,s,1(${EXTEN}))
 same => n,Hangup()

; International and everything unmatched: refuse and log (toll-fraud guard).
exten => _X.,1,NoOp(REJECTED ${CALLERID(num)} -> ${EXTEN})
 same => n,Hangup(21)

; --- Sequential carrier failover with limits -------------------------------
[outbound]
; ARG1 = dialed number (EXTEN is "s" inside a subroutine)
exten => s,1,Set(GROUP(user)=${CALLERID(num)})
 ; per-user concurrency: at most 2 outbound calls at a time
 same => n,GotoIf($[${GROUP_COUNT(${CALLERID(num)}@user)} > 2]?busy)
 ; maximum call duration (seconds) for the whole call
 same => n,Set(TIMEOUT(absolute)=3600)
 ; per-carrier concurrency: carrier-a at most 30 channels
 same => n,Set(GROUP(carrier)=carrier-a)
 same => n,GotoIf($[${GROUP_COUNT(carrier-a@carrier)} > 30]?trynext)
 same => n,Dial(PJSIP/${ARG1}@carrier-a,60,L(3600000:60000:30000))
 ; failover only when carrier-a could not take the call
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?trynext)
 same => n,Hangup()
 same => n(trynext),Set(GROUP(carrier)=mobile)
 same => n,Dial(PJSIP/${ARG1}@mobile,60,L(3600000:60000:30000))
 same => n,Hangup()
 same => n(busy),Busy()

; --- Carriers (arrive on 5080, identified as the carrier endpoint) ----------
; This context can only ring local extensions: no Dial to a carrier, no
; transfer out, so a compromised carrier account cannot pivot to toll fraud.
[from-carrier]
exten => _[0-9A-Za-z].,1,NoOp(carrier=${CHANNEL(endpoint)} X-FreeSBC-Carrier=${PJSIP_HEADER(read,X-FreeSBC-Carrier)} DID=${EXTEN} from=${CALLERID(num)})
 same => n,Goto(did,${EXTEN},1)

[did]
; Registered line (Request-URI user is the contact_user) and explicit DIDs.
exten => acct,1,Dial(PJSIP/1001,30)
 same => n,Hangup()
exten => 5551001,1,Dial(PJSIP/1001,30)
 same => n,Hangup()
exten => _[0-9A-Za-z].,1,Hangup(1)
