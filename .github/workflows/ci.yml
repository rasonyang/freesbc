# Fast checks on every push to main and every pull request: formatting,
# module tidiness, vet, build, the example config, the full test suite
# under the race detector, and known-vulnerability scanning. The long
# checks (repeated runs, fuzzing) live in soak.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: gofmt / tidy / vet / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      # Every golang:<version> image tag (the perf rig, docs) must match
      # go.mod's go line. docs/performance.md records past runs' Go.
      - name: golang image tags match go.mod
        run: |
          want=$(sed -n 's/^go //p' go.mod)
          [ -n "$want" ] || { echo "::error::no go line in go.mod"; exit 1; }
          stale=$(git grep -noE 'golang:[0-9]([0-9.]*[0-9])?' -- . ':!docs/performance.md' ':!docs/notes/' \
            | awk -v want="golang:$want" '{ t = $0; sub(/^.*golang:/, "golang:", t) } t != want')
          if [ -n "$stale" ]; then
            echo "::error::golang image tags differ from go.mod's go $want:"
            echo "$stale"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -o freesbc -ldflags "-X main.version=${GITHUB_SHA::12}" ./cmd/freesbc

      - name: check example config
        run: ./freesbc check -c freesbc.example.yaml

  test:
    name: go test -race
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Linux routes all of 127/8, so the test that binds 127.0.0.2 runs
      # here (it skips on a stock macOS runner).
      - name: go test -race
        run: go test -race -count=1 -timeout 20m ./... 2>&1 | grep -v 'UDP ref went negative on try close'; exit "${PIPESTATUS[0]}"

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned to a release that builds with the go.mod toolchain, so the
      # standard library is scanned at the version freesbc is built with.
      # Bump it with the toolchain: its SSA builder (x/tools) must parse
      # that standard library, and v1.1.4 (x/tools v0.29) panics on go1.27.
      - name: govulncheck
        env:
          GOTOOLCHAIN: local
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # install.sh: syntax and shellcheck, then end-to-end runs against a
  # release packaged exactly as release.yml does it (linux/amd64 only) and
  # served from localhost through FREESBC_BASE_URL. install.yml runs the
  # script against the real GitHub releases after each release.
  #
  # A pull request has no OIDC token to sign with, so the FREESBC_VERIFY
  # cases use a stub cosign: it accepts only the verify-blob call install.sh
  # must make (bundle, identity regexp and issuer below, exactly) and passes
  # when the blob's sha256 equals the digest recorded in the fixture bundle.
  install:
    name: install.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: v0.0.0-ci
      BAD: v0.0.0-bad
      SIGNED: v0.0.0-signed
      TAMPERED: v0.0.0-tampered
      BROKEN: v0.0.0-broken
      CERT_IDENTITY: '^https://github\.com/rasonyang/freesbc/\.github/workflows/release\.yml@refs/(tags/v[^/]+|heads/main)$'
      CERT_ISSUER: https://token.actions.githubusercontent.com
      FREESBC_BASE_URL: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: sh -n and shellcheck
        run: |
          sh -n install.sh
          shellcheck install.sh

      - name: package a test release
        run: |
          set -euo pipefail
          name="freesbc_${TAG}_linux_amd64"
          stage="${RUNNER_TEMP}/stage/${name}"
          srv="${RUNNER_TEMP}/srv/download/${TAG}"
          mkdir -p "$stage" "$srv"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${TAG}" \
            -o "${stage}/freesbc" ./cmd/freesbc
          chmod 0755 "${stage}/freesbc"
          cp README.md freesbc.example.yaml "$stage"/
          if [ -f LICENSE ]; then cp LICENSE "$stage"/; fi
          cp packaging/freesbc.service "$stage"/
          tar -C "${RUNNER_TEMP}/stage" -czf "${srv}/${name}.tar.gz" "$name"
          (cd "$srv" && sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS)
          # A second release whose tarball no longer matches its own line.
          bad="${RUNNER_TEMP}/srv/download/${BAD}"
          mkdir -p "$bad"
          cp "${srv}/${name}.tar.gz" "${bad}/freesbc_${BAD}_linux_amd64.tar.gz"
          (cd "$bad" && sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS)
          printf 'corrupt' | dd of="${bad}/freesbc_${BAD}_linux_amd64.tar.gz" bs=1 seek=100 conv=notrunc

      - name: package signed test releases
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP}/stage/freesbc_${TAG}_linux_amd64"
          # release T: the staged build as release T, with its SHA256SUMS.
          release() {
            local n="freesbc_${1}_linux_amd64" d="${RUNNER_TEMP}/srv/download/${1}"
            mkdir -p "$d"
            rm -rf "${RUNNER_TEMP}/stage/${n}"
            cp -R "$base" "${RUNNER_TEMP}/stage/${n}"
            tar -C "${RUNNER_TEMP}/stage" -czf "${d}/${n}.tar.gz" "$n"
            (cd "$d" && sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS)
          }
          # sign T: a fixture bundle carrying the digest of T's SHA256SUMS,
          # where a real Sigstore bundle carries it too.
          sign() {
            local d="${RUNNER_TEMP}/srv/download/${1}"
            printf '{"mediaType":"application/vnd.dev.sigstore.bundle.v0.3+json","verificationMaterial":{},"messageSignature":{"messageDigest":{"algorithm":"SHA2_256","digest":"%s"},"signature":""}}\n' \
              "$(openssl dgst -sha256 -binary "${d}/SHA256SUMS" | base64)" > "${d}/SHA256SUMS.sigstore.json"
          }
          release "$SIGNED"; sign "$SIGNED"
          # A changed tarball, with SHA256SUMS rewritten to match it and the
          # original bundle kept: only the signature can catch it.
          release "$TAMPERED"; sign "$TAMPERED"
          t="${RUNNER_TEMP}/srv/download/${TAMPERED}"
          cp "${t}/SHA256SUMS" "${RUNNER_TEMP}/tampered.orig"
          echo changed > "${RUNNER_TEMP}/stage/freesbc_${TAMPERED}_linux_amd64/EXTRA"
          tar -C "${RUNNER_TEMP}/stage" -czf "${t}/freesbc_${TAMPERED}_linux_amd64.tar.gz" "freesbc_${TAMPERED}_linux_amd64"
          (cd "$t" && sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS)
          if cmp -s "${t}/SHA256SUMS" "${RUNNER_TEMP}/tampered.orig"; then echo "::error::SHA256SUMS did not change"; exit 1; fi
          release "$BROKEN"
          echo 'not a bundle' > "${RUNNER_TEMP}/srv/download/${BROKEN}/SHA256SUMS.sigstore.json"

      - name: write the stub cosign
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/stub"
          # The expected identity and issuer are written into the stub, so
          # it does not depend on the environment install.sh runs in.
          {
          echo '#!/bin/sh'
          echo '# Stub cosign for the install job: see the job comment in ci.yml.'
          printf "want_identity='%s'\nwant_issuer='%s'\n" "$CERT_IDENTITY" "$CERT_ISSUER"
          cat << 'EOF'
          set -eu
          fail() { echo "stub cosign: $*" >&2; exit 1; }
          [ "${1:-}" = verify-blob ] || fail "want verify-blob, got: $*"
          shift
          bundle= identity= issuer= blob=
          while [ $# -gt 0 ]; do
            case $1 in
            --bundle) bundle=$2; shift 2 ;;
            --certificate-identity-regexp) identity=$2; shift 2 ;;
            --certificate-oidc-issuer) issuer=$2; shift 2 ;;
            -*) fail "unexpected flag $1" ;;
            *) [ -z "$blob" ] || fail "more than one blob"; blob=$1; shift ;;
            esac
          done
          [ "$identity" = "$want_identity" ] || fail "identity regexp is '$identity', want '$want_identity'"
          [ "$issuer" = "$want_issuer" ] || fail "issuer is '$issuer', want '$want_issuer'"
          [ -f "$bundle" ] || fail "no bundle file: '$bundle'"
          [ -f "$blob" ] || fail "no blob file: '$blob'"
          want=$(sed -n 's/.*"messageDigest":{"algorithm":"SHA2_256","digest":"\([^"]*\)".*/\1/p' "$bundle")
          [ -n "$want" ] || fail "no digest in the bundle"
          got=$(openssl dgst -sha256 -binary "$blob" | base64)
          [ "$got" = "$want" ] || fail "digest mismatch: blob $got, bundle $want"
          echo 'Verified OK' >&2
          EOF
          } > "${RUNNER_TEMP}/stub/cosign"
          chmod 0755 "${RUNNER_TEMP}/stub/cosign"
          head -n 4 "${RUNNER_TEMP}/stub/cosign"

      - name: serve it on localhost
        run: |
          python3 -m http.server 18080 --bind 127.0.0.1 --directory "${RUNNER_TEMP}/srv" \
            > "${RUNNER_TEMP}/http.log" 2>&1 &
          for _ in $(seq 50); do
            curl -fsS -o /dev/null "${FREESBC_BASE_URL}/download/${TAG}/SHA256SUMS" 2> /dev/null && exit 0
            sleep 0.2
          done
          echo "::error::http.server did not start"; cat "${RUNNER_TEMP}/http.log"; exit 1

      - name: usage errors
        run: |
          sh install.sh --help > /dev/null
          rc=0; sh install.sh --bogus 2> /dev/null || rc=$?
          [ "$rc" = 2 ] || { echo "::error::unknown flag exited $rc, want 2"; exit 1; }
          rc=0; FREESBC_VERIFY=yes sh install.sh 2> /dev/null || rc=$?
          [ "$rc" = 2 ] || { echo "::error::FREESBC_VERIFY=yes exited $rc, want 2"; exit 1; }

      - name: dry run installs nothing
        run: |
          set -euo pipefail
          FREESBC_VERSION="$TAG" FREESBC_PREFIX="${RUNNER_TEMP}/dry" sh install.sh --dry-run --no-service
          [ ! -e "${RUNNER_TEMP}/dry" ] || { echo "::error::--dry-run created the prefix"; exit 1; }
          # As root on a systemd host: the service steps are printed, not run.
          out=$(sudo env FREESBC_BASE_URL="$FREESBC_BASE_URL" FREESBC_VERSION="$TAG" \
            FREESBC_PREFIX="${RUNNER_TEMP}/dry" sh install.sh --dry-run)
          echo "$out"
          grep -q '^+ systemctl daemon-reload' <<< "$out"
          if [ -e "${RUNNER_TEMP}/dry" ] || [ -e /etc/systemd/system/freesbc.service ] || id freesbc 2> /dev/null; then
            echo "::error::--dry-run changed the system"; exit 1
          fi

      - name: install --no-service, then re-run
        run: |
          set -euo pipefail
          for run in 1 2; do
            FREESBC_VERSION="$TAG" FREESBC_PREFIX="${RUNNER_TEMP}/p" sh install.sh --no-service
            got=$("${RUNNER_TEMP}/p/bin/freesbc" version | awk '{print $2}')
            [ "$got" = "$TAG" ] || { echo "::error::run $run: version is $got, want $TAG"; exit 1; }
          done

      - name: corrupted tarball fails and installs nothing
        run: |
          if FREESBC_VERSION="$BAD" FREESBC_PREFIX="${RUNNER_TEMP}/bad" sh install.sh --no-service; then
            echo "::error::install.sh accepted a tarball that does not match SHA256SUMS"; exit 1
          fi
          [ ! -e "${RUNNER_TEMP}/bad" ] || { echo "::error::a failed verification left files behind"; exit 1; }

      # FREESBC_VERIFY with the stub cosign. Each failing case must exit
      # non-zero and leave its prefix uncreated.
      - name: signature of SHA256SUMS
        run: |
          set -euo pipefail
          stub="${RUNNER_TEMP}/stub:${PATH}"
          # inst NAME TAG VERIFY PATH [FLAGS]: install TAG into prefix NAME.
          inst() {
            local p="${RUNNER_TEMP}/sig-${1}"
            env PATH="$4" FREESBC_VERSION="$2" FREESBC_VERIFY="$3" FREESBC_PREFIX="$p" sh install.sh --no-service "${@:5}"
          }
          # must_fail NAME TAG VERIFY PATH WHY
          must_fail() {
            if inst "$1" "$2" "$3" "$4"; then echo "::error::$5"; exit 1; fi
            [ ! -e "${RUNNER_TEMP}/sig-${1}" ] || { echo "::error::$1: a failed verification left files behind"; exit 1; }
          }
          # installed NAME: the binary is in prefix NAME and runs.
          installed() {
            got=$("${RUNNER_TEMP}/sig-${1}/bin/freesbc" version | awk '{print $2}')
            [ "$got" = "$TAG" ] || { echo "::error::$1: version is $got, want $TAG"; exit 1; }
          }
          ! env PATH=/usr/bin:/bin sh -c 'command -v cosign' || { echo "::error::cosign in /usr/bin or /bin"; exit 1; }

          out=$(inst dry "$SIGNED" require "$stub" --dry-run 2>&1); echo "$out"
          grep -q 'verified the signature of SHA256SUMS' <<< "$out"
          [ ! -e "${RUNNER_TEMP}/sig-dry" ] || { echo "::error::--dry-run created the prefix"; exit 1; }
          inst signed "$SIGNED" require "$stub"; installed signed
          must_fail tampered "$TAMPERED" auto "$stub" "a tampered SHA256SUMS passed the signature check"
          must_fail nocosign "$SIGNED" require /usr/bin:/bin "require installed without cosign"
          must_fail nobundle "$TAG" require "$stub" "require installed a release with no bundle"
          inst unsigned "$TAG" auto "$stub"; installed unsigned
          inst off "$BROKEN" off "$stub"; installed off
          must_fail broken "$BROKEN" auto "$stub" "auto accepted a broken bundle"

      # The runner has systemd and passwordless sudo, so the service step runs
      # for real: user, /etc/freesbc, unit with ExecStart under the prefix,
      # init from FREESBC_* and a config that is never overwritten. The unit
      # must be installed but not enabled or started.
      - name: install as root with the service step
        run: |
          set -euo pipefail
          for run in 1 2; do
            sudo env FREESBC_BASE_URL="$FREESBC_BASE_URL" FREESBC_VERSION="$TAG" FREESBC_PREFIX=/opt/freesbc \
              FREESBC_SWITCH=10.0.0.5 FREESBC_PRIVATE_IP=10.0.0.2 FREESBC_PUBLIC_IP=203.0.113.7 \
              FREESBC_PUBLIC_BIND=192.0.2.10 sh install.sh
            [ "$run" = 2 ] || sum=$(sudo sha256sum /etc/freesbc/freesbc.yaml)
          done
          [ "$sum" = "$(sudo sha256sum /etc/freesbc/freesbc.yaml)" ] || { echo "::error::re-run changed the config"; exit 1; }
          id freesbc
          [ "$(stat -c '%a %U:%G' /etc/freesbc)" = "750 root:freesbc" ]
          [ "$(sudo stat -c '%a %U:%G' /etc/freesbc/freesbc.yaml)" = "640 root:freesbc" ]
          grep -qx 'ExecStart=/opt/freesbc/bin/freesbc run -c /etc/freesbc/freesbc.yaml' /etc/systemd/system/freesbc.service
          systemctl cat freesbc > /dev/null
          [ "$(systemctl is-enabled freesbc || true)" = disabled ]
          [ "$(systemctl is-active freesbc || true)" = inactive ]
          got=$(/opt/freesbc/bin/freesbc version | awk '{print $2}')
          [ "$got" = "$TAG" ] || { echo "::error::version is $got, want $TAG"; exit 1; }
