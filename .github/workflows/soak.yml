# Long-running checks, nightly and on demand:
#   soak    - places calls through the trunk plane for a fixed duration
#             under -race and fails on goroutine, heap or fd growth
#             (internal/trunk/soak_test.go, gated by FREESBC_SOAK).
#   repeat  - the whole suite N times under -race, to surface flaky or
#             order-dependent tests and slow leaks the single run misses.
#   fuzz    - each native Go fuzz target for a fixed time; a crashing
#             input is uploaded as an artifact to commit under testdata/.
name: Soak

on:
  schedule:
    - cron: "17 19 * * *" # daily, 19:17 UTC
  workflow_dispatch:
    inputs:
      soak_duration:
        description: Trunk soak duration (Go duration)
        default: 30m
      repeat_count:
        description: go test -count for the repeat job
        default: "3"
      fuzz_time:
        description: -fuzztime per fuzz target
        default: 5m

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: trunk soak (-race)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FREESBC_SOAK: ${{ inputs.soak_duration || '30m' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: soak
        run: go test -race -run '^TestSoakTrunkCalls$' -count=1 -v -timeout 110m ./internal/trunk 2>&1 | grep -v 'UDP ref went negative on try close'; exit "${PIPESTATUS[0]}"

  repeat:
    name: go test -race -count=N
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COUNT: ${{ inputs.repeat_count || '3' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: repeat
        run: go test -race -count="$COUNT" -timeout 110m ./... 2>&1 | grep -v 'UDP ref went negative on try close'; exit "${PIPESTATUS[0]}"

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/config, target: FuzzAuditConfigParse }
          - { pkg: ./internal/media, target: FuzzAuditClassify }
          - { pkg: ./internal/media, target: FuzzAuditDemux }
          - { pkg: ./internal/media, target: FuzzAuditSRTPUnprotect }
          - { pkg: ./internal/media, target: FuzzAuditSRTPRoundTrip }
          - { pkg: ./internal/media, target: FuzzAuditWebRTCLegPreICE }
          - { pkg: ./internal/media, target: FuzzAuditWebRTCEstablished }
          - { pkg: ./internal/sip, target: FuzzAuditSIPMessageHelpers }
          - { pkg: ./internal/sip/sdp, target: FuzzAuditParseBuild }
          - { pkg: ./internal/sip/sdp, target: FuzzAuditBuildNoSentinelLeak }
          - { pkg: ./internal/trunk, target: FuzzAuditChallengeRealm }
          - { pkg: ./internal/trunk, target: FuzzAuditSIPHeaderHelpers }
          - { pkg: ./internal/trunk, target: FuzzAuditParseCryptoAttrs }
          - { pkg: ./internal/trunk, target: FuzzAuditTrunkSDP }
    env:
      FUZZTIME: ${{ inputs.fuzz_time || '5m' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fuzz
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "$FUZZTIME" ${{ matrix.pkg }}
      - name: upload crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: ${{ matrix.pkg }}/testdata/fuzz/${{ matrix.target }}
          if-no-files-found: ignore
