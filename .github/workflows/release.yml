# Builds prebuilt freesbc binaries for a version tag and attaches them to
# the GitHub Release: one tar.gz per OS/arch, install.sh, SHA256SUMS and
# SHA256SUMS.sigstore.json, a Sigstore bundle signing SHA256SUMS keyless
# through GitHub OIDC (no key exists; the certificate names this workflow
# and its ref, and the signature is logged in Rekor). Runs on every pushed
# v* tag; run it by hand from main with a tag to backfill an existing
# release (it then signs as refs/heads/main, which install.sh accepts).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write # the OIDC token cosign trades for its signing certificate

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build and package
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="freesbc_${TAG}_${os}_${arch}"
            stage="dist/${name}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "${stage}/freesbc" ./cmd/freesbc
            chmod 0755 "${stage}/freesbc"
            cp README.md freesbc.example.yaml "$stage"/
            if [ -f LICENSE ]; then cp LICENSE "$stage"/; fi
            if [ "$os" = linux ]; then cp packaging/freesbc.service "$stage"/; fi
            tar -C dist -czf "dist/${name}.tar.gz" "$name"
            rm -rf "$stage"
          done
          # The installer is published beside the tarballs so the
          # releases/latest/download/install.sh URL matches the release. A
          # backfilled tag from before install.sh existed has none.
          if [ -f install.sh ]; then install -m 0755 install.sh dist/install.sh; fi
          cd dist
          sums=(./*.tar.gz)
          if [ -f install.sh ]; then sums+=(./install.sh); fi
          sha256sum "${sums[@]}" | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS

      - name: sanity check linux/amd64 binary
        run: |
          set -euo pipefail
          tar -xzf "dist/freesbc_${TAG}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          dir="${RUNNER_TEMP}/freesbc_${TAG}_linux_amd64"
          got=$("${dir}/freesbc" version | awk '{print $2}')
          [ "$got" = "$TAG" ] || { echo "version is $got, want $TAG" >&2; exit 1; }
          file "${dir}/freesbc"
          "${dir}/freesbc" check -c "${dir}/freesbc.example.yaml"

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      # Verified at once with the identity and issuer install.sh and
      # docs/install.md use, so a signature they would reject is never
      # published.
      - name: sign SHA256SUMS
        env:
          CERT_IDENTITY: '^https://github\.com/rasonyang/freesbc/\.github/workflows/release\.yml@refs/(tags/v[^/]+|heads/main)$'
          CERT_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_ISSUER" dist/SHA256SUMS

      - name: publish release assets
        run: |
          set -euo pipefail
          assets=(dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sigstore.json)
          if [ -f dist/install.sh ]; then assets+=(dist/install.sh); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" --generate-notes --verify-tag
          fi
