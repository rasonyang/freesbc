# FreeSBC example configuration.
#
#   cp freesbc.example.yaml freesbc.yaml
#   freesbc check -c freesbc.yaml
#   freesbc run   -c freesbc.yaml
#
#   Phones / browsers / carriers        Private LAN / VPN
#            │                                  │
#        public.ip ──── FreeSBC ──── private.ip ─┴── switch (FreeSWITCH / Asterisk)
#
# ${ENV_VAR} is expanded in string values at load time and never written back.
# See docs/config.md for every key, default, and validation rule.

# --- Topology: each address is written once --------------------------------

public:
  ip: 203.0.113.7            # advertised to phones, browsers, carriers
  # bind: 172.31.5.10        # only behind 1:1 NAT (cloud VM); default = ip

private:
  ip: 10.77.0.2              # faces the switch; bind = advertised. It may equal public.bind
                             # only behind 1:1 NAT (public.ip differs): one UDP socket, edge.listen.udp 5060,
                             # then serves both sides and the switch is identified by its source IP
                             # (docs/edge.md, "Single-IP host behind a 1:1 NAT")

rtp: 20000-29999             # one range, allocated independently per bind IP (halved capacity if they are one IP)

# tls:                       # identity for sips:// and wss:// and a remote admin;
#   cert: /etc/freesbc/cert.pem  # required only by edge.listen.tls, edge.listen.wss
#   key:  /etc/freesbc/key.pem   # or admin.allow_remote

# --- Edge -------------------------------------------------------------------
#
# One private socket, no key of its own: private.ip:5060 (the public udp socket itself,
# private.ip:<listen.udp>, when private.ip equals public.bind).
# The switch sends everything there:
#   - proxied REGISTER / calls to clients   (Request-URI carries ;fsbc=<token>)
#   - carrier REGISTER / INVITE / OPTIONS   (outbound proxy; Request-URI host
#                                            is a carrier below)
# Carrier accounts, line selection and failover live on the switch.

edge:
  switch: [10.77.0.10:5060]  # literal IP:port; more than one = hash-user pool
  srtp: optional            # SDES-SRTP for registered clients: off (default) | optional | required;
  #                         #   applied per call by the transport the client registered over:
  #                         #   tls/wss only, unless allow_insecure_sdes: true. With the shipped
  #                         #   listeners every client registers over udp/tcp, so `optional`
  #                         #   changes nothing — and `required` would refuse every such call
  #                         #   with 488. Making it real: the steps after `listen`.
  # allow_insecure_sdes: false  # true puts the SDES keys on plaintext signaling; never in public
  # allow_register_auth_mismatch: false  # true only if the switch maps an auth user to another AoR
  switch_carrier_port: 5080  # carriers (FreeSWITCH: external profile port);
                             #   default = the switch port above;
                             #   switch-side configs: examples/switch/
  listen:                    # ports on public.bind; present = enabled
    udp: 5060
    tcp: 5060                # SIP/TCP; shares the number with udp, they are separate sockets
    # tls: 5061              # SIP/TLS (sips); needs tls
    # wss: 443               # enables WebRTC (ICE-Lite, DTLS-SRTP, rtcp-mux); needs tls
    # ws: 8080               # plaintext WebSocket, development only

  # --- Making srtp real -----------------------------------------------------
  # SDES keys travel in the SDP, so `srtp` does nothing for a client whose
  # signaling is not TLS or WSS — what matters is the transport each client
  # registered over, not which listeners exist. To make it real:
  #   1. uncomment the top-level `tls:` block above;
  #   2. under `listen`, uncomment `tls: 5061` (sips clients get SDES-SRTP;
  #      browsers on `wss` get DTLS-SRTP regardless of this key);
  #   3. keep `srtp: optional` (a plain RTP/AVP answer is accepted as plain —
  #      a downgrade by design) or set `required` (RTP/SAVP only; a plain
  #      offer is refused 488 — and every call from a client still registered
  #      over udp/tcp is refused 488, so it locks out the clients that stay
  #      on the shipped udp/tcp listeners).
  # Either way the switch leg stays plain RTP — FreeSBC decrypts and
  # re-encrypts whenever a leg is encrypted; see docs/edge.md, "What the media
  # plane can and cannot protect".

  # advertise:               # only when the NAT translates a port: Via/Contact/
  #   udp: 16060             # Record-Route name 16060, the socket binds 5060;
  #   tcp: 16060             # signaling only, forward the rtp range 1:1

  carriers:                  # where the switch may send requests (allowlist);
    mobile:    198.51.100.10:16060    # must equal the switch gateway's host[:port]
    fixed:     198.51.100.11:16060    # name is stamped as X-FreeSBC-Carrier on inbound calls
    carrier-a: sip.carrier-a.com      # DNS name: SRV, then A/AAAA. An answer naming a private,
                                      #   loopback, link-local or FreeSBC/switch address is refused;
                                      #   write a carrier on a private network as a literal IP
    secure:                           # mapping form: transport udp (default) | tcp | tls
      host: sip.secure-carrier.com    # tls: SRV _sips._tcp, port 5061; the certificate must name this host
      transport: tls
      srtp: required                  # SDES-SRTP toward this carrier: off (default) | optional | required; needs tls
      ca_file: /etc/freesbc/secure-carrier-ca.pem   # replaces the system roots; optional
      # client_cert: /etc/freesbc/client.pem        # mutual TLS: both or neither
      # client_key:  /etc/freesbc/client.key
  # carrier_sources: [198.51.100.20, 203.0.113.0/28]   # extra inbound carrier IPs

# --- Operator API, /metrics, WebUI ------------------------------------------

# admin:
#   listen: 127.0.0.1:8080
#   password_hash: "REPLACE-WITH-BCRYPT-HASH"   # freesbc hash-password
#   allowed_hosts: [sbc.example.net]            # extra Host names (no port); loopback and listen are implied

# --- Mirror SIP signaling to HOMER over HEP (docs/homer.md) -------------------

# hep:
#   address: 10.77.0.50:9060   # literal IP:port; HOMER 11: 9060 udp/tcp, 9061 tls
#   transport: udp             # udp | tcp | tls
#   # tls:                     # only with transport: tls
#   #   ca: /etc/freesbc/homer-ca.pem
#   #   cert: /etc/freesbc/hep-client.pem   # optional, for HOMER mutual_tls
#   #   key:  /etc/freesbc/hep-client.key
#   capture_id: 2001
#   node_name: freesbc-edge1
#   redact_auth: true          # mask Authorization / Proxy-Authorization in the copy (default)
