; REHEARSAL-ONLY dialplan for the 3-host rig. Same behaviour as
; test/perf/freeswitch/dialplan/perfload.xml: 2000 answers and echoes the
; caller's RTP, everything else is refused. No Dial(), nothing can reach a
; carrier.

[general]
static=yes
writeprotect=no

[perfload]
exten => 2000,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => _X.,1,Hangup(1)
