# /etc/sysctl.d/99-freesbc-load.conf on S2 (FreeSBC) and S1 (SIPp).
#
# FreeSBC never sets SO_RCVBUF/SO_SNDBUF, so every SIP and RTP socket gets
# the *default* buffer size: raising only *_max does nothing for it.
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.netdev_max_backlog = 250000
# Keep ephemeral ports out of the RTP range (SBC_RTP=10000-59999).
net.ipv4.ip_local_port_range = 60000 65000
# Only if a stateful host firewall is on (see README §3.4): every call is
# 4 UDP flows on S2.
# net.netfilter.nf_conntrack_max = 2097152
# net.netfilter.nf_conntrack_udp_timeout = 30
