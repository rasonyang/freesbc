; Load-test dialplan; the same numbers exist on FreeSWITCH.
[general]
static=yes
writeprotect=yes

[from-carrier]
; T1: carrier -> switch, answered and echoed
exten => _80X.,1,Answer()
 same => n,Echo()
 same => n,Hangup()
; T2: carrier -> switch -> back out to the carrier (both FreeSBC paths)
exten => _81X.,1,Dial(PJSIP/${EXTEN}@loadcarrier,30)
 same => n,Hangup()
; T4: carrier -> switch -> registered agent 82<user>
exten => _82X.,1,Dial(PJSIP/${EXTEN:2},30)
 same => n,Hangup()

[from-client]
; T3: registered phone -> echo
exten => 7100,1,Answer()
 same => n,Echo()
 same => n,Hangup()
; T6d: rings for 30 s before answering (holds the call early)
exten => 7101,1,Ringing()
 same => n,Wait(30)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
