# FreeSBC example configuration.
# Copy to sbc.yaml, adjust, then:  freesbc run -c sbc.yaml
#
# ${ENV_VAR} references are expanded at load time (never written back to
# disk) and work in plain string values such as passwords, addresses, and
# IPs — but not inside compound scalars like port_range, durations, or
# listener URLs.

listen:
  sip:
    - udp://0.0.0.0:5060
    - tls://0.0.0.0:5061          # cert auto-generated (self-signed) if not configured
  # tls_cert: /etc/freesbc/sip-cert.pem    # serve a REAL certificate on tls listeners (TLS >= 1.2);
  # tls_key:  /etc/freesbc/sip-key.pem     #   without these, each start mints a self-signed cert (warned)
  # tls_client_ca: /etc/freesbc/client-ca.pem  # optional mTLS: clients must present a cert chaining to this CA
  media:
    port_range: 16384-32768
    public_ip: 203.0.113.10        # your SBC's public IP (advertised in SDP/Contact).
                                    # "auto" (STUN) is a future milestone.
    # rtp_timeout: 5m              # tear down calls after this much RTP silence

# NAT/VPN alternative: separate bind and advertised addresses. When
# sip.bind_ip is set it REPLACES listen.sip (remove the list above — the two
# are mutually exclusive), and advertised_ip/advertised_port default to the
# bind values. The sip and rtp sections are independent of each other.
#
# sip:
#   bind_ip: 10.77.0.2             # private VPN/NAT address the listener binds
#   bind_port: 16060
#   transport: udp                 # udp (default), tcp, or tls
#   advertised_ip: 198.51.100.7    # what Contact/From/REGISTER claim (must be routable from the far side)
#   advertised_port: 16060
# rtp:
#   bind_ip: 10.77.0.2             # RTP/RTCP sockets bind here (empty = every interface)
#   advertised_ip: 203.0.113.7     # what SDP c=/o= claim; REQUIRED with sip.bind_ip
#                                   #   unless listen.media.public_ip is a literal address
#   port_min: 20000                # explicit RTP port range; both or neither, and it
#   port_max: 20100                #   REPLACES listen.media.port_range (the two are
#                                   #   mutually exclusive). port_min must be < port_max.

ring_timeout: 60s   # cancel a target that rings this long without answering, then failover
register_expires: 3600s   # requested REGISTER lifetime for register:true peers (carrier may grant less)
session_expires: 1800s   # RFC 4028 session timer we advertise/accept (carrier may lower it)
min_se: 90s              # smallest session interval accepted; a lower request gets 422 + Min-SE
peer_cooldown: 30s   # after a connect failure (no response) to a peer endpoint, skip it this long before retrying
srv_cache_ttl: 300s  # cache DNS SRV/A resolutions this long (Go's resolver exposes no record TTL, so this is a fixed window)
# max_concurrent_calls: 100        # global cap on in-flight bridged calls (0 = unlimited, default)

peers:
  carrier-a:
    address: sip.carrier-a.com:5060   # DNS SRV honored, falls back to A/AAAA (M4.4, not yet implemented)
    transport: udp
    auth: { username: acct01, password: "${CARRIER_A_PASS}" }
    # Pinned realm (T-19): just add it to the auth line — auth: { username: ..., password: ..., realm: carrier-a-realm }
    # Once set, 401/407 challenges whose realm does not match are no longer answered (stops malicious or compromised servers from harvesting digest responses)
    register: true                 # registration-based trunk: SBC periodically sends REGISTER, un-registers on shutdown
    allowed_ips: [203.0.113.0/24]  # inbound calls matched to this peer by source IP
    # media_latch: strict          # strict (default): first RTP packet must
    #                              # come from the SDP-signaled IP; use loose
    #                              # for peers behind hard NAT
    # max_concurrent_calls: 50     # per-peer cap on concurrent calls from this peer (0 = unlimited, default); excess gets 503 + Retry-After
    srtp: disabled   # media encryption: disabled (default) | optional | required (RTP/SAVP + a=crypto)
    # tls_ca: /etc/freesbc/carrier-ca.pem   # for transport: tls — ADD this CA bundle to the outbound trust
    #                                       #   anchors, so a private-CA carrier verifies (still strict)
    # tls_client_cert: /etc/freesbc/carrier-client.pem   # present OUR cert when the carrier wants
    # tls_client_key:  /etc/freesbc/carrier-client-key.pem   # mTLS (both-or-neither)
  internal-pbx:
    address: 10.0.0.10:5060
    allowed_ips: [10.0.0.0/8]

routes:
  # When using transform, anchor match with ^...$ — an unanchored pattern
  # replaces every occurrence and keeps surrounding text. Use ${1} (not $1)
  # to place a capture group next to literal digits, e.g. "${1}000".
  - name: outbound
    from: internal-pbx
    match: { to: "^9(\\d+)$" }
    transform: { to: "$1" }
    to: [carrier-a]                # list order = failover order
  - name: inbound
    from: carrier-a
    to: [internal-pbx]

shield:                            # sensible defaults; the whole section is optional
  rate_limit: 20/s per_ip
  peer_rate_limit: 200/s per_ip    # looser per-IP ceiling for CONFIGURED peer sources (they skip the ban/scanner plane, not this)
  auto_ban: { failures: 5, window: 60s, duration: 1h }
  nftables: auto

# admin:                            # optional operator API + Prometheus /metrics (bcrypt HTTP Basic Auth)
#   listen: 127.0.0.1:8080          # default must be loopback; see docs/DEPLOYMENT-SECURITY.md (G-2)
#   # allow_remote: true            # REQUIRED to bind a non-loopback (e.g. LAN) address — refused otherwise
#   # tls_cert: /etc/freesbc/admin-cert.pem   # serve HTTPS (TLS >= 1.2) instead of plaintext —
#   # tls_key:  /etc/freesbc/admin-key.pem    #   strongly recommended whenever allow_remote is on
#   auth:
#     username: admin
#     # bcrypt hash of the admin password — REPLACE this placeholder (an invalid
#     # value here fails config validation on purpose, so you can't accidentally
#     # ship a known/default password). Cost 10 or higher is enforced. Generate with:
#     #   htpasswd -bnBC 10 "" 'your-password' | tr -d ':\n'
#     password_hash: "REPLACE-WITH-YOUR-OWN-BCRYPT-HASH"

# ---------------------------------------------------------------------------
# Edge proxy plane (optional): SIP/RTP/WebRTC proxy in front of FreeSWITCH
# ---------------------------------------------------------------------------
#
# Everything above configures the TRUNK plane (B2BUA between carriers and a
# PBX). The sections below configure a completely independent second plane:
# a stateful SIP proxy for phones and browsers, with FreeSWITCH behind it as
# the authoritative registrar and switch.
#
#              Public Internet                  Private LAN / VPN
#   SIP phone  (SIP/UDP + RTP)  ─┐
#                               ├─▶  FreeSBC  ─── SIP/UDP + RTP ──▶ FreeSWITCH
#   Browser    (SIP/WSS + WebRTC)┘
#
# The plane turns on when sip.upstream.address is set. The two planes share
# only the process: separate listeners, separate user agent, separate media
# pools. Either may run alone; a proxy-only deployment needs no peers and no
# listen.sip at all.
#
# Uncomment and adjust:
#
# network:
#   public:                          # the side facing phones and browsers
#     bind_ip: 0.0.0.0
#     advertised_ip: 203.0.113.7     # REQUIRED when bind_ip is a wildcard —
#                                    #   it is what Contact, Via and SDP claim
#   private:                         # the side facing FreeSWITCH
#     bind_ip: 10.77.0.2
#     # advertised_ip: 10.77.0.2     # defaults to bind_ip when specific
#
# sip:
#   public:
#     udp: { enabled: true,  bind: 0.0.0.0:16060 }
#     ws:  { enabled: true,  bind: 0.0.0.0:18080 }   # plaintext; for testing
#     wss:
#       enabled: true
#       bind: 0.0.0.0:18443
#       cert_file: /etc/freesbc/wss-cert.pem   # a browser REFUSES an untrusted
#       key_file:  /etc/freesbc/wss-key.pem    #   certificate on a WSS socket
#   private:
#     bind: 10.77.0.2:5060           # FreeSBC's own FreeSWITCH-facing socket:
#                                    #   the source of everything it sends
#                                    #   upstream and where FreeSWITCH sends
#                                    #   inbound calls and in-dialog requests
#   upstream:
#     address: 10.77.0.10:5060       # FreeSWITCH. Must be a literal IP:port —
#                                    #   the private leg never resolves DNS
#     transport: udp                 # the only supported value today
#
#   # Optional peer-to-peer PSTN trunk: outbound calls from FreeSWITCH's
#   # dialplan, bridged to sip:<number>@10.77.0.2:16060 (the MATCH address),
#   # are forwarded to carrier gateways that never register — FreeSBC never
#   # pings them, and inbound carrier calls need no special handling. The
#   # bridge is recognised by its SOURCE (FreeSWITCH's own IP) plus its
#   # Request-URI naming the match, so a public phone dialling the same
#   # address is not hijacked. The match must be a host:port FreeSWITCH
#   # uses for nothing else: here it is the SBC's public UDP listener
#   # (bound 0.0.0.0:16060) as FreeSWITCH reaches it from the private LAN.
#   # Two shapes: the multi-gateway form (gateways + routes below) or the
#   # single-gateway shorthand `address: <host:port>` — mutually exclusive.
#   # pstn:
#   #   match: 10.77.0.2:16060        # what the dialplan dials PSTN prefixes to
#   #   # attempt_timeout: 32s        # per-gateway attempt budget (default 32s)
#   #   # cooldown: 30s               # passive health penalty window (default 30s)
#   #   gateways:
#   #     gw-mobile: { address: 223.76.90.4:16060 }  # literal IP:port; transport: udp implied
#   #     gw-fixed:   { address: 223.76.90.5:16060 }
#   #   routes:                       # first match wins; multiple catch-alls legal
#   #     - match: "^1[3-9]\d{9}$"    # Go regexp on the called number
#   #       to: [gw-mobile]
#   #     - to: [gw-fixed, gw-mobile]  # no match = catch-all; to: order = failover order
#
# rtp:
#   public:                          # media toward phones/browsers
#     bind_ip: 0.0.0.0
#     advertised_ip: 203.0.113.7
#     port_min: 30000
#     port_max: 39999
#   private:                         # media toward FreeSWITCH
#     bind_ip: 10.77.0.2
#     port_min: 40000
#     port_max: 49999
#   # The two ranges (and the trunk plane's own range, if that plane runs on
#   # the same interface) must not overlap — validation rejects it, since two
#   # pools handing out one port is a silent capacity cliff.
#
# webrtc:
#   enabled: true                    # requires sip.public.ws or wss
#   ice_mode: lite                   # the only supported mode
#   rtcp_mux: true                   # required
#   # dtls_cert_file: /etc/freesbc/dtls-cert.pem   # optional: pin the DTLS
#   # dtls_key_file:  /etc/freesbc/dtls-key.pem    #   identity instead of the
#   #                                              #   per-process self-signed one
#
# FreeSWITCH side: point your phones' SIP domain at FreeSWITCH as usual and
# let FreeSBC proxy REGISTER through. FreeSBC rewrites the Contact so
# FreeSWITCH stores an address that routes back through the SBC, and
# rewrites it back on the way to the client.
#
# For outbound PSTN calls (with the pstn block above), bridge the dialplan
# to the match address — a plain profile bridge; no gateway definition is
# needed on FreeSWITCH, this trunk is peer-to-peer:
#
#   <action application="bridge"
#           data="sofia/internal/sip:${destination_number}@10.77.0.2:16060"/>
#
# The bridge reaches FreeSBC on its public UDP socket; FreeSBC anchors the
# media and forwards the call to the carrier gateway, exactly like a call
# to a registered phone. Inbound carrier→FreeSWITCH calls need no extra
# configuration: they arrive on the public side like any other unregistered
# caller and are proxied upstream unchanged.
