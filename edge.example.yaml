# FreeSBC — edge proxy example.
#
# A complete, proxy-only deployment: SIP/UDP phones and sip.js browsers on
# the public side, one FreeSWITCH on the private side, every media stream
# anchored through the SBC.
#
#                     Public Internet
#                           │
#          ┌────────────────┴────────────────┐
#          │                                 │
#    SIP Phone                         Browser / sip.js
#    SIP/UDP + RTP                     SIP/WSS + WebRTC
#          │                                 │
#          └──────────────┐   ┌──────────────┘
#                         ▼   ▼
#                    ┌────────────┐
#                    │  FreeSBC   │
#                    │ SIP Proxy  │
#                    │ RTP Proxy  │
#                    │ WebRTC GW  │
#                    └─────┬──────┘
#                          │  Private LAN / VPN
#                          │  SIP/UDP + RTP
#                          ▼
#                    FreeSWITCH
#
# There are no `peers:` or `routes:` here: those configure the separate
# trunk B2BUA plane, which this deployment does not use. Add them alongside
# these sections to run both planes in one process. (Outbound PSTN calls
# are a different feature — the commented `sip.pstn` section below — and
# ride THIS plane, not the trunk plane.)
#
#   freesbc check -c edge.example.yaml
#   freesbc run   -c edge.example.yaml

network:
  public:
    bind_ip: 0.0.0.0            # listen on every interface...
    advertised_ip: 203.0.113.7  # ...but tell the world THIS address
  private:
    bind_ip: 10.77.0.2          # a specific address, so advertised_ip
                                #   defaults to it

sip:
  public:
    udp:
      enabled: true
      bind: 0.0.0.0:16060
    ws:
      enabled: false            # plaintext WebSocket: development only
      bind: 0.0.0.0:18080
    wss:
      enabled: true
      bind: 0.0.0.0:18443
      # A browser refuses an untrusted certificate on a WSS socket, and
      # there is no way to click through the warning. Use a real one.
      cert_file: /etc/freesbc/wss-cert.pem
      key_file: /etc/freesbc/wss-key.pem

  private:
    bind: 10.77.0.2:5060        # FreeSBC's own FreeSWITCH-facing socket

  upstream:
    address: 10.77.0.10:5060    # FreeSWITCH — a literal IP:port
    transport: udp

  # Optional: a peer-to-peer PSTN trunk. Uncomment to let FreeSWITCH bridge
  # outbound PSTN calls through the SBC to a carrier gateway that never
  # registers (FreeSBC never pings it). A bridged call is one whose source
  # is FreeSWITCH AND whose Request-URI names the match address — the SBC
  # forwards it to the gateway with media anchored on both legs, exactly
  # like a call to a registered client. The match is what the FreeSWITCH
  # dialplan dials PSTN prefixes to, so it must be an address FreeSWITCH
  # uses for nothing else (validation refuses the SBC's own sockets and the
  # upstream). Here FreeSWITCH reaches the public UDP listener, bound
  # 0.0.0.0:16060, at the SBC's private address 10.77.0.2:16060.
  # pstn:
  #   address: 223.76.90.4:16060  # the carrier gateway — a literal IP:port
  #   transport: udp              # the only supported value today
  #   match: 10.77.0.2:16060      # FreeSWITCH dials sip:<number>@THIS address

rtp:
  public:
    bind_ip: 0.0.0.0
    advertised_ip: 203.0.113.7
    port_min: 30000
    port_max: 39999
  private:
    bind_ip: 10.77.0.2
    port_min: 40000
    port_max: 49999

webrtc:
  enabled: true
  ice_mode: lite
  rtcp_mux: true

listen:
  media:
    rtp_timeout: 5m             # reclaim a call after this much media silence

shield:
  rate_limit: 20/s per_ip       # public clients come from arbitrary addresses,
  auto_ban:                     #   so the abuse plane matters here
    failures: 5
    window: 60s
    duration: 1h

